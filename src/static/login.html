<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Вхід — Germany Business Validation Workspace</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='17' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="login-brand">GBV</div>
  <p class="login-sub">Germany Business Validation Workspace</p>
  <div class="login-error" id="loginError" hidden></div>
  <form method="post" action="/login">
    <label for="username">Ім'я користувача</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Увійти</button>
  </form>
  <p class="login-foot">Дані зберігаються в SQLite на вашому сервері.</p>
</main>
<script src="/static/login.js"></script>
</body>
</html>
